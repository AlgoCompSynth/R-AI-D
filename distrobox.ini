[R-AI-D-CPU]
home=$HOME/dbx-homes/R-AI-D-CPU
image=docker.io/library/fedora:44
additional_packages="systemd"
init=true
pull=true
root=false
replace=true
start_now=true
volume=$HOST_MODEL_PERSISTENCE:/usr/share/ollama/.ollama/models:rw

[R-AI-D-CUDA]
home=$HOME/dbx-homes/R-AI-D-CUDA
image=docker.io/library/fedora:44
additional_packages="systemd libva-nvidia-driver"
init=true
pull=true
root=false
replace=true
start_now=true
volume=$HOST_MODEL_PERSISTENCE:/usr/share/ollama/.ollama/models:rw

