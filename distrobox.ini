[R-AI-D-CPU]
home=$CONTAINER_HOME
image=localhost/r-ai-d-base:latest
additional_packages="libpam-systemd systemd"
additional_flags="--security-opt=label=disable"
init=true
root=false
replace=true
start_now=true
volume=$HOST_MODEL_PERSISTENCE:/usr/share/ollama/.ollama/models:rw

[R-AI-D-CUDA]
home=$CONTAINER_HOME
image=localhost/r-ai-d-base:latest
additional_packages="libpam-systemd systemd"
additional_flags="--security-opt=label=disable --device=nvidia.com/gpu=all"
init=true
root=false
replace=true
start_now=true
volume=$HOST_MODEL_PERSISTENCE:/usr/share/ollama/.ollama/models:rw

