[R-AI-D-CPU]
home=$CONTAINER_HOME
image=docker.io/library/fedora:44
additional_packages="systemd"
additional_flags="--security-opt=label=disable"
init=true
pull=true
root=false
replace=true
start_now=true
volume=$HOST_MODEL_PERSISTENCE:/usr/share/ollama/.ollama/models:rw

[R-AI-D-CUDA]
home=$CONTAINER_HOME
image=docker.io/library/fedora:44
additional_packages="systemd libva-nvidia-driver"
additional_flags="--security-opt=label=disable --device=nvidia.com/gpu=all"
init=true
pull=true
root=false
replace=true
start_now=true
volume=$HOST_MODEL_PERSISTENCE:/usr/share/ollama/.ollama/models:rw

